# Defines packaging, interpreter, and tool requirements for the Python Magos runner.
# Runtime dependencies must remain minimal; security-sensitive dependencies must be pinned and audited before release.
[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "magos-runner"
version = "0.1.0"
description = "Local Firecracker microVM runner for CLI coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
magos = "magos_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["magos_runner*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
